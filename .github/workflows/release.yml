name: Release

# Builds the app and the standalone updater from the full source tree and publishes the artifacts to a
# GitHub release. Trigger on a `v*` tag (or run manually). Everything is compiled here from source; no
# binaries are committed to the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The text renderer (font_raster.cpp) links FreeType directly. CMake falls back to Qt's *private*
  # modules Qt6BundledFreetype/Qt6FreetypePrivate when a standalone FreeType isn't found, and those
  # private modules only became findable CMake packages in Qt 6.10. Pin to a Qt that ships them.
  QT_VERSION: '6.11.1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the full source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Unpack Steamworks headers (optional)
        shell: pwsh
        env:
          STEAMWORKS_HEADERS_B64: ${{ secrets.STEAMWORKS_HEADERS_B64 }}
        run: |
          if ($env:STEAMWORKS_HEADERS_B64) {
            $zip = Join-Path $env:RUNNER_TEMP 'steamworks-headers.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'steamworks-headers'
            [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($env:STEAMWORKS_HEADERS_B64))
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            "STEAMWORKS_HEADERS=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Steamworks headers unpacked to $dir (xmb-steam-client will be built)"
          } else {
            Write-Host "No STEAMWORKS_HEADERS_B64 secret; building without the xmb-steam-client helper."
          }

      - name: Build the app and the updater
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\Microsoft Visual Studio\Installer;$env:PATH"
          .\native-xmb\build.ps1 -OutputDirectory C:\release\out -QtRoot "$env:QT_ROOT_DIR"

      - name: Package the app
        shell: pwsh
        run: |
          .\native-xmb\packaging\build-package.ps1 -OutputDirectory C:\release\out -PackageDirectory C:\release\dist\re-ps3 -Zip

      - name: Package the updater (exe + its Qt DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\release\dist\xmb-updater -Force | Out-Null
          Copy-Item C:\release\out\xmb-updater.exe C:\release\dist\xmb-updater\
          & (Join-Path "$env:QT_ROOT_DIR" 'bin\windeployqt.exe') --release --no-translations --no-compiler-runtime C:\release\dist\xmb-updater\xmb-updater.exe
          Compress-Archive -Path C:\release\dist\xmb-updater\* -DestinationPath C:\release\dist\xmb-updater.zip

      # The in-app updater (src/updater.cpp) refuses a release unless it can verify re-ps3.zip against a
      # SHA-256, taken from a `SHA256: <hex>` line in the notes or a `re-ps3.zip.sha256` asset. Attach the
      # sidecar in the usual `<hex>  <file>` form. It also refuses a tag that is not newer than the running
      # app's version, which comes from project(VERSION ...) in CMakeLists.txt, so the two must agree.
      - name: Write the SHA-256 sidecar and check the version
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 C:\release\dist\re-ps3.zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('C:\release\dist\re-ps3.zip.sha256', "$hash  re-ps3.zip`n")
          Write-Host "re-ps3.zip SHA-256: $hash"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $cmake = Get-Content native-xmb\CMakeLists.txt -Raw
            if ($cmake -notmatch 'project\(\s*\S+\s+VERSION\s+([0-9.]+)') { throw 'No project(VERSION) in native-xmb/CMakeLists.txt' }
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $Matches[1]) { throw "Tag $env:GITHUB_REF_NAME does not match CMake project version $($Matches[1]); bump project(VERSION) first." }
          }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            C:\release\dist\re-ps3.zip
            C:\release\dist\re-ps3.zip.sha256
            C:\release\dist\xmb-updater.zip
          generate_release_notes: true
